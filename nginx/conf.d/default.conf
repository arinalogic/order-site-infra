# Ограничение частоты запросов к входу и регистрации: 5 в минуту с одного адреса
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;
# Ограничение частоты отправки метрик: 3 запроса в секунду с одного адреса
limit_req_zone $binary_remote_addr zone=metrics_limit:10m rate=3r/s;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Список услуг для выпадающего списка: только чтение
    location = /api/admin-settings/ {
        limit_except GET POST {
            deny all;
        }
        proxy_pass http://backend:8000/admin-settings/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Заявки: отправка с сайта (POST) и список для админки (GET, нужен токен)
    location = /api/applications/ {
        limit_except GET POST {
            deny all;
        }
        proxy_pass http://backend:8000/applications/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # Проверка, есть ли администраторы: только GET
    location = /api/auth/check {
        limit_except GET {
            deny all;
        }
        proxy_pass http://backend:8000/auth/check;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Кто вошёл: только GET (нужен токен)
    location = /api/auth/me {
        limit_except GET {
            deny all;
        }
        proxy_pass http://backend:8000/auth/me;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Вход: только POST, не чаще 5 в минуту (всплеск до 5), при превышении ответ 429
    location = /api/auth/login {
        limit_except POST {
            deny all;
        }
        limit_req zone=auth_limit burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:8000/auth/login;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Регистрация первого администратора: только POST, с тем же ограничением
    location = /api/auth/register {
        limit_except POST {
            deny all;
        }
        limit_req zone=auth_limit burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:8000/auth/register;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Изменение и удаление услуги по номеру: только PUT и DELETE (нужен токен)
    location ~ ^/api/admin-settings/[0-9]+$ {
        limit_except PUT DELETE {
            deny all;
        }
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # Приём метрик поведения: только POST, не чаще 3 в секунду (всплеск до 10), лог не пишем
    location = /api/behavior-metrics/ {
        limit_except POST {
            deny all;
        }
        limit_req zone=metrics_limit burst=10 nodelay;
        limit_req_status 429;
        client_max_body_size 64k;
        access_log off;
        proxy_pass http://backend:8000/behavior-metrics/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Сводка метрик для админки: только GET (нужен токен)
    location = /api/behavior-metrics/summary {
        limit_except GET {
            deny all;
        }
        proxy_pass http://backend:8000/behavior-metrics/summary;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Данные для heatmap: только GET (нужен токен)
    location = /api/behavior-metrics/heatmap {
        limit_except GET {
            deny all;
        }
        proxy_pass http://backend:8000/behavior-metrics/heatmap;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # Одна заявка по номеру: только GET (нужен токен)
    location ~ ^/api/applications/[0-9]+$ {
        limit_except GET {
            deny all;
        }
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # Всё остальное в /api/ (в том числе /docs) закрыто
    location /api/ {
        return 404;
    }
}

