server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Список услуг для выпадающего списка: только чтение
    location = /api/admin-settings/ {
        limit_except GET {
            deny all;
        }
        proxy_pass http://backend:8000/admin-settings/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Отправка заявки: только POST
    location = /api/applications/ {
        limit_except POST {
            deny all;
        }
        proxy_pass http://backend:8000/applications/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Всё остальное в /api/ (в том числе /docs) закрыто
    location /api/ {
        return 404;
    }
}

server {
    listen 5050;
    server_name _;

    location / {
        proxy_pass http://pgadmin:80;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
    }
}

server {
    listen 5000;
    server_name _;

    client_max_body_size 0;

    location / {
        proxy_pass http://registry:5000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}
